name: real_landlords_for_students
description: "A student-first room-finding app for Tashkent."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  remove_alpha_ios: true
  background_color_ios: "#FAFAF7"
  adaptive_icon_background: "#FAFAF7"
  adaptive_icon_foreground: assets/app_icon_foreground.png
  adaptive_icon_foreground_inset: 12
  web:
    generate: true
    image_path: assets/app_icon.png
    background_color: "#FAFAF7"
    theme_color: "#176B5B"
  windows:
    generate: true
    image_path: assets/app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/app_icon.png
